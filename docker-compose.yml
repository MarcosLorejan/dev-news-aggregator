# Local development: PostgreSQL only.
# Rails and Vite run on the host (see README / docs/DEVELOPMENT.md).
# The production Dockerfile is for Kamal / image builds, not this compose file.
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dev_news_aggregator_development}
      POSTGRES_USER: ${POSTGRES_USER:-dev_news_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dev_news_user} -d ${POSTGRES_DB:-dev_news_aggregator_development}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
