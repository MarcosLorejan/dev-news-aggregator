development: &default
  # News fetching configuration
  fetching:
    # How many articles to fetch per source
    max_articles_per_source: 30
    
    # Timeout for API requests (in seconds)
    request_timeout: 30
    
    # How often to retry failed requests
    max_retries: 3

    # Max concurrent /item/{id} requests for Hacker News
    hn_item_concurrency: 10
  
  # Data retention
  retention:
    # Keep articles for this many days
    article_retention_days: 30
    
    # Clean old articles automatically
    auto_cleanup: true
  
  # Starter keyword interests, seeded into keyword_filters when the table is empty.
  # Terms are matched as phrases against article title + description.
  interests:
    - name: "Ruby"
      terms: [ "ruby", "rubygems", "sorbet" ]
    - name: "Rails"
      terms: [ "rails", "activerecord", "hotwire", "turbo" ]
    - name: "Rust"
      terms: [ "rust", "cargo", "tokio" ]
    - name: "Software architecture"
      terms: [ "software architecture", "system design", "domain-driven", "ddd", "event sourcing" ]
    - name: "AI performance"
      terms: [ "inference", "quantization", "prompt optimization", "llm latency", "context window" ]

  # API endpoints
  apis:
    hacker_news:
      base_url: "https://hacker-news.firebaseio.com/v0"
      topstories_endpoint: "/topstories.json"
      item_endpoint: "/item"
    
    devto:
      base_url: "https://dev.to/api"
      articles_endpoint: "/articles"
      
    reddit:
      # Public JSON listings return 403 without OAuth. Default path is Atom RSS
      # (.rss). Set REDDIT_CLIENT_ID + REDDIT_CLIENT_SECRET to use OAuth JSON
      # listings (includes score / comment_count).
      base_url: "https://www.reddit.com/r"
      format: ".rss"
      # Shared throttle across all RedditFetcher instances (seconds).
      min_request_interval_seconds: 2.5
      # Extra retries after HTTP 429 before the source FetchRun fails.
      rate_limit_max_retries: 4
      subreddits:
        - programming
        - webdev
        - javascript
        - ruby
        - rust
        - netsec
        - cybersecurity
        - technology
        - MachineLearning
        - artificial
        - LocalLLaMA

    youtube:
      # Public channel Atom feeds — no API key / quota. Prefer channel_id (UC...).
      feed_base_url: "https://www.youtube.com/feeds/videos.xml"
      min_request_interval_seconds: 2.0
      rate_limit_max_retries: 4
      # Optional videos.list enrichment (1 unit / call, up to 50 IDs). Needs YOUTUBE_API_KEY.
      enrich_with_api: true
      enrich_batch_size: 50
      enrich_max_per_run: 100
      # After enrichment, drop videos longer than this (seconds). 0 disables.
      max_duration_seconds: 1200
      # Keyword search discovery (search.list). Disabled by default — burns ~100 units/call.
      search:
        enabled: false
        daily_call_budget: 20
        min_interval_hours: 12
        max_results: 10
        video_duration: medium # short | medium | long | any
        order: date # date | relevance | viewCount | rating
        relevance_language: en
        region_code: US
        published_after_days: 7 # used when a filter has never been searched
      channels:
        - channel_id: "UCWnPjmqvljcafA0QXblOU1A"
          name: "Confreaks"
        - channel_id: "UCsBjURrPoezykLs9EqgamOA"
          name: "Fireship"
        - channel_id: "UC_x5XG1OV2P6uZZ5FSM9Ttw"
          name: "Google for Developers"
        - channel_id: "UCUyeluBRhGPCW4rPe7MhPUA"
          name: "ThePrimeagen"

test:
  <<: *default
  fetching:
    max_articles_per_source: 5
    request_timeout: 10
    hn_item_concurrency: 3
  retention:
    article_retention_days: 7

production:
  <<: *default
  fetching:
    max_articles_per_source: 50
    request_timeout: 60
    max_retries: 5
    hn_item_concurrency: 10
  retention:
    article_retention_days: 60
